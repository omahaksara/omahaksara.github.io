<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mengarahkan Undangan — Omah Aksara</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Inter:wght@300&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #181314; color: #E0A996; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
        .wrap { animation: fadeIn 1s ease; }
        .names { font-family: 'Playfair Display', serif; font-size: 2.2rem; margin: 0.5rem 0; color: #FCE8E3; }
        .sub { font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.7; }
        .dots::after { content: ''; animation: dots 1.5s infinite; }
        @keyframes dots { 0%{content:''} 33%{content:'.'} 66%{content:'..'} 100%{content:'...'} }
        @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="sub">Omah Aksara Studio</div>
        <div id="names" class="names">Memuat Undangan</div>
        <div class="sub">menyiapkan halaman<span class="dots"></span></div>
    </div>
<script>
let rawUrl = window.location.href;
let sp = new URLSearchParams(window.location.search);
let toParam = sp.get('to');

// Ekstraksi parameter &to= jika formatnya unik
if(!toParam && rawUrl.includes('&to=')){
    toParam = rawUrl.split('&to=')[1].split('&')[0].split('#')[0];
    toParam = decodeURIComponent(toParam.replace(/\+/g,' '));
}
if(!toParam && rawUrl.includes('?to=')){
    let m = rawUrl.split('to=')[1];
    if(m){ toParam = decodeURIComponent(m.split('&')[0].split('#')[0].replace(/\+/g,' ')); }
}

// Ambil slug klien dari path URL (misal: /budi-ani -> budi-ani)
const pathParts = window.location.pathname.split('/').filter(Boolean);
let client = pathParts[0];

// Filter jika path merupakan file/folder sistem shortener
if (['album', 'lagu', 'index.html', '404.html'].includes(client)) {
    client = null;
}

const baseUrl = 'https://omahaksara.github.io/invitation';

if (!client) {
    window.location.href = `${baseUrl}/`;
} else {
    client = client.split('&')[0].split('?')[0];
    
    // Cek data.json langsung ke repositori invitation yang baru
    fetch(`https://omahaksara.github.io/invitation/clients/${client}/data.json`)
    .then(res => {
        if (!res.ok) throw new Error('Data tidak ditemukan');
        return res.json();
    })
    .then(data => {
        // Ambil nama panggilan mempelai dari skema baru
        const g = data.couple?.groom?.nickname || '';
        const b = data.couple?.bride?.nickname || '';
        if(g && b) {
            document.getElementById('names').textContent = `${g} & ${b}`;
        }
        
        // Redirect mulus ke SPA utama invitation dengan membawa parameter tamu
        setTimeout(() => {
            const toQuery = toParam ? `&to=${encodeURIComponent(toParam)}` : '';
            window.location.href = `${baseUrl}/?c=${client}${toQuery}`;
        }, 500);
     })
    .catch(() => {
        document.getElementById('names').textContent = 'Undangan Tidak Ditemukan';
    });
}
</script>
</body>
</html>
