<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mengarahkan Undangan — Omah Aksara</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Inter:wght@300&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #181314; color: #E0A996; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
        .wrap { animation: fadeIn 1s ease; }
        .names { font-family: 'Playfair Display', serif; font-size: 2.2rem; margin: 0.5rem 0; color: #FCE8E3; }
        .sub { font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.7; }
        .dots::after { content: ''; animation: dots 1.5s infinite; }
        @keyframes dots { 0%{content:''} 33%{content:'.'} 66%{content:'..'} 100%{content:'...'} }
        @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="sub">Omah Aksara Studio</div>
        <div id="names" class="names">Memuat Undangan</div>
        <div class="sub">menyiapkan halaman<span class="dots"></span></div>
    </div>
<script>
(() => {
  "use strict";
  const baseUrl = "https://omahaksara.github.io/invitation";
  const parts = window.location.pathname.split("/").filter(Boolean).map(part => {
    try { return decodeURIComponent(part); } catch (_) { return part; }
  });
  const params = new URLSearchParams(window.location.search);
  const systemPaths = new Set(["album", "lagu", "index.html", "404.html"]);
  const client = (parts[0] || "").split("&")[0].split("?")[0];
  const pathTheme = parts.length >= 2 ? parts[1] : "";
  const pathGuest = parts.length >= 3 ? parts.slice(2).join(" ").replace(/-/g, " ") : "";
  const guest = (params.get("to") || pathGuest || "").trim();
  const queryTheme = params.get("theme") || "";
  const themePattern = /^[a-z0-9][a-z0-9-]*$/i;
  const requestedTheme = themePattern.test(pathTheme) ? pathTheme : (themePattern.test(queryTheme) ? queryTheme : "");
  const names = document.getElementById("names");
  const setStatus = message => { if (names) names.textContent = message; };

  if (!client || systemPaths.has(client) || !/^[a-z0-9][a-z0-9-]*$/i.test(client)) {
    window.location.replace(baseUrl + "/");
    return;
  }

  const dataUrl = new URL("clients/" + encodeURIComponent(client) + "/data.json", baseUrl + "/");
  dataUrl.searchParams.set("_v", "20261028a");
  fetch(dataUrl, { cache: "no-store" })
    .then(response => {
      if (!response.ok) throw new Error("Data undangan tidak ditemukan.");
      return response.json();
    })
    .then(async data => {
      if ((data.slug && data.slug !== client) || data.status !== "published" || data.demoMode === true) {
        throw new Error("Undangan tidak tersedia untuk dibagikan.");
      }
      const groom = data.couple && data.couple.groom && data.couple.groom.nickname || "";
      const bride = data.couple && data.couple.bride && data.couple.bride.nickname || "";
      if (groom && bride) setStatus(groom + " & " + bride);

      // A short URL may override the default theme only with a registered active theme.
      let theme = "";
      if (requestedTheme) {
        try {
          const registryResponse = await fetch(baseUrl + "/templates/registry.json?_v=20261028a", { cache: "no-store" });
          if (registryResponse.ok) {
            const registry = await registryResponse.json();
            const candidate = requestedTheme === "royal" ? "royal-vintage" : requestedTheme;
            const active = Array.isArray(registry.themes)
              && registry.themes.some(item => item && item.slug === candidate && item.status === "active");
            if (active) theme = candidate;
          }
        } catch (_) {
          // On registry/network trouble, use the invitation's configured theme.
        }
      }
      const configured = data.theme === "royal" ? "royal-vintage" : data.theme;
      const finalTheme = theme || configured;
      const target = new URL(baseUrl + "/");
      target.searchParams.set("c", client);
      if (finalTheme && themePattern.test(finalTheme)) target.searchParams.set("theme", finalTheme);
      if (guest) target.searchParams.set("to", guest);
      window.location.replace(target.toString());
    })
    .catch(error => {
      console.error("Gagal membuka link pendek Omah Aksara:", error);
      setStatus("Undangan Tidak Ditemukan");
      const sub = document.querySelector(".wrap .sub:last-child");
      if (sub) sub.textContent = "Periksa kembali tautan undangan";
    });
})();
</script>
</body>
</html>
